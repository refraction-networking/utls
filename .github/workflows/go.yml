# Release gates for uTLS v2. docs/RELEASING.md lists the same gates for a
# local run.
name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        # 1.27.3 is the minimum (the mirrored crypto/tls release, go.mod);
        # "stable" catches breakage from newer standard libraries early.
        go: ["1.27.3", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go version
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (includes the upstream crypto/tls suite, API gate, fidelity, fuzz seeds)
        run: go test -count=1 ./...
      - name: Race
        if: matrix.os != 'windows-latest'
        run: go test -count=1 -race ./...

  gates:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - name: Mirror == pristine(upstream/VERSION) + upstream/utls.patch; shims current
        run: sh upstream/sync.sh check
      - name: Sync tool fixtures
        run: go test -count=1 ./upstream/cmd/utls-sync
      - name: Type-checked API compatibility (api/v2.txt) and gate fixtures
        run: go test -count=1 -run 'TestAPI' .
      - name: Bounded fuzzing
        run: |
          go test -run '^$' -fuzz '^FuzzParseClientHello$' -fuzztime 60s -fuzzminimizetime 5s .
          go test -run '^$' -fuzz '^FuzzSNIHostRange$' -fuzztime 60s -fuzzminimizetime 5s ./internal/tls
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  reality-interop:
    # The real XTLS/REALITY server (Xray-core's pin) in an isolated module,
    # so its dependencies never enter the uTLS runtime module.
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: interop/reality
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: interop/reality/go.sum
      - name: Vet
        run: go vet ./...
      - name: REALITY interop (classical/hybrid/ML-DSA-65, negative authentication)
        run: go test -count=1 -race -v ./...

  boringssl-interop:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      BORINGSSL_COMMIT: 17b5a42023a2220f6b0912139e31ebccd9b98aad
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - name: Build BoringSSL at the pinned commit
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build clang zlib1g-dev
          git clone https://boringssl.googlesource.com/boringssl "$RUNNER_TEMP/boringssl"
          git -C "$RUNNER_TEMP/boringssl" checkout "$BORINGSSL_COMMIT"
          cmake -GNinja -B "$RUNNER_TEMP/boringssl/build" -S "$RUNNER_TEMP/boringssl" -DCMAKE_BUILD_TYPE=Release
          ninja -C "$RUNNER_TEMP/boringssl/build" ssl crypto
      - name: TLS interop (zlib certificate compression, ALPS old/new codepoints)
        run: |
          PEER=$(BORINGSSL="$RUNNER_TEMP/boringssl" OUT="$RUNNER_TEMP/peer" sh interop/boringssl/build.sh)
          UTLS_BSSL_PEER="$PEER" go test -count=1 -tags bsslinterop -run BoringSSL -v .
