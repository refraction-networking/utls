name: CI
on:
  push:
    branches: [master, "claude/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (offline)
        run: go test ./...
      - name: Upstream patch is in sync
        run: bash upstream/sync.sh check
